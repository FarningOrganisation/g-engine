site_name: g
site_description: A beginner-friendly, component-based Python 2D game engine
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

plugins:
  - search
  - gen-files:
      scripts:
        - docs/generate_api.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            inherited_members: false
            show_if_no_docstring: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

exclude_docs: |
  generate_api.py

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - First game: getting-started/first-game.md
      - Editor: getting-started/editor.md
  - Guides:
      - Game, scenes, and timing: guides/scenes.md
      - Objects and scripts: guides/objects.md
      - Input and coordinates: guides/input.md
      - Resources, colors, and text: guides/resources.md
      - Physics: guides/physics.md
      - Tile maps and navigation: guides/tilemaps.md
      - GUI: guides/gui.md
      - Animation and effects: guides/effects.md
      - Shaders: guides/shaders.md
      - Persistence and exporting: guides/persistence.md
      - Experimental networking: guides/networking.md
  - API reference: api/
  - Development:
      - Documentation: development/documentation.md
      - Testing and compatibility: development/testing.md
